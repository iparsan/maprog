name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Maprog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Maprog-apk
          path: Maprog.apk

      # Publica el APK en la página de Releases (descarga directa desde el móvil)
      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Maprog (compilación ${{ github.run_number }})
          body: APK compilado automáticamente desde el commit ${{ github.sha }}. Instálalo en Android 8.0 o superior.
          files: Maprog.apk
          make_latest: true
